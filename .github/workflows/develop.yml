
name: Development CI

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Code-Quality:
    uses: ./.github/workflows/code-quality.yml

  Build-Debug:
    needs: [Code-Quality]
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install Tuist
        uses: jdx/mise-action@v4
        with:
          install: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run unit tests
        run: bundle exec fastlane test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_output

      - name: Build Debug archive
        run: bundle exec fastlane build_debug

      - name: Upload Debug archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-archive
          path: build/App-Debug.xcarchive
